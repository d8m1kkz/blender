# Основной файл — PRODUCTION без HTTPS (всё на одной машине, доступ по http://<IP>).
# Вариант с caddy и HTTPS (sslip.io) лежит в запасе: compose.caddy.yml накладывается поверх этого файла.
# Для разработки рядом лежит compose.override.yml: `docker compose up` подхватывает его сам и накладывает отличия.
# Явно production (без override): `docker compose -f compose.yml ...`
# Сервис gen описан в compose_gen.yml и подключается через include.

include:
  - compose_gen.yml

# Лимит логов Docker (иначе json-file растёт бесконечно): до 3 файлов по 10 МБ на контейнер
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # nginx: раздаёт статику и передаёт PHP-запросы в php (см. nginx/nginx.conf). Единственный вход снаружи (порт 80):
  nginx:
    image: d8m1kkz/blender-nginx:latest
    build:
      context: ./nginx
      additional_contexts:
        app: service:php # статика копируется из образа php (см. nginx/Dockerfile)
    ports:
      - "80:80"
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - php

  # php-fpm с кодом Laravel внутри образа: к нему обращается только nginx.
  php:
    image: d8m1kkz/blender-php:latest
    build:
      context: ./php
      target: app
    env_file:
      - ./php/.env.beget # настройки Laravel (APP_ENV, GEN_ORIGINS…) для production
      - ./php/.env.beget.key # APP_KEY (секрет, в git его нет)
    environment:
      - GEN_URL=http://gen:8080 # адрес gen для MCP (<сайт>/mcp): запросы идут из контейнера php
    volumes:
      - app-storage:/var/www/html/storage
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - gen

volumes:
  app-storage:
