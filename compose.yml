services:
  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./web:/var/www/html
    ports:
      - "5173:5173" # Порт по умолчанию для dev-сервера Vite
    command: npm run dev

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./web:/var/www/html
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - generator

  php:
    image: d8m1kkz/blender-php:latest
    build:
        context: ./web
        target: base
    volumes:
      - ./web:/var/www/html
    depends_on:
      - generator

  generator:
    image: d8m1kkz/blender-gen:latest
    build:
      context: ./gen
    ports:
      - "8080:8080"
    volumes:
      - ./gen:/app
    shm_size: '64mb'
    environment:
      - PYTHONUNBUFFERED=1
