services:
  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./web:/var/www/html
    ports:
      - "5173:5173" # Порт по умолчанию для dev-сервера Vite
    command: npm run dev

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./web:/var/www/html
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - gen

  php:
    image: d8m1kkz/blender-php:dev
    build:
        context: ./web
        target: base
    volumes:
      - ./web:/var/www/html
    depends_on:
      - gen

  gen:
    image: d8m1kkz/blender-gen:dev
    build:
      context: ./gen
    command: uvicorn web:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    volumes:
      - ./gen:/app
    shm_size: '64mb'
    environment:
      - PYTHONUNBUFFERED=1
