# Сборка образа gen и деплой gen и caddy на VPS Beget. Вся цепочка:
#   1. На рабочем компьютере: git push в ветку dev.
#   2. Здесь, на временной машине GitHub: сборка образа gen и отправка на Docker Hub.
#   3. Только после этого: перенос коммитов из dev в main.
#   4. Деплой: scripts/deploy.vps.beget.sh (вход на VPS, перезапуск контейнеров, ожидание ответа gen).
# Ошибка на любом шаге отменяет следующие: при неудачной сборке main и VPS не меняются.
# Всё в одном сценарии: push в main со стандартным токеном GitHub другие сценарии не запускает.
# Секреты (на GitHub: Settings → Secrets and variables → Actions):
#   DOCKERHUB_TOKEN — токен Docker Hub пользователя d8m1kkz с правами Read & Write
#   VPS_SSH_KEY     — закрытый ключ для входа на VPS, без пароля
name: Сборка и деплой gen

on:
  push:
    branches: [dev]
  workflow_dispatch: # и вручную: вкладка Actions → Run workflow, ветка dev

permissions:
  contents: write # нужно для переноса коммитов в main

# два запуска не идут одновременно: следующий ждёт окончания текущего
concurrency:
  group: deploy-gen

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' # ручной запуск из другой ветки пропускается
    runs-on: ubuntu-latest
    timeout-minutes: 30 # первая сборка, пока нет кэша, самая долгая
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # вся история: нужна для проверки и переноса в main

      # До сборки, чтобы не отправить на Docker Hub образ из коммита, который нельзя перенести в main
      - name: В dev есть всё, что есть в main?
        run: |
          git merge-base --is-ancestor origin/main HEAD || {
            echo "::error::В main есть коммиты, которых нет в dev. В ветке dev: git fetch, затем git merge origin/main"
            exit 1
          }

      # Машина GitHub каждый раз пустая, поэтому кэш сборки хранится на Docker Hub (тег buildcache).
      # --provenance=false: без сведений о запуске сборки, которые меняли бы образ при тех же слоях
      - name: Собрать образ gen и отправить на Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker login -u d8m1kkz --password-stdin <<<"$DOCKERHUB_TOKEN"
          docker buildx create --use
          cache=type=registry,ref=d8m1kkz/blender-gen:buildcache
          docker buildx bake -f compose_gen.yml gen --push --provenance=false \
            --set "gen.cache-from=$cache" \
            --set "gen.cache-to=$cache,mode=max"

      # Если коммиты уже перенесены вручную, git push ничего не делает и деплой продолжается
      - name: Перенести коммиты в main
        run: |
          git push origin HEAD:main || {
            echo "::error::main не обновлена. Если GitHub отказал из-за изменений в .github/workflows, выполните на своём компьютере git push origin dev:main и перезапустите этот запуск"
            exit 1
          }

      - name: Развернуть
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: | # ключ отдаётся ssh-agent и на диск не записывается
          eval "$(ssh-agent -s)"
          tr -d '\r' <<<"$VPS_SSH_KEY" | ssh-add -
          scripts/deploy.vps.beget.sh
