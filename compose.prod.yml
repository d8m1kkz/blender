services:
  nginx:
    image: d8m1kkz/blender-nginx:latest
    build:
      context: ./web
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - php
      - generator

  php:
    image: d8m1kkz/blender-php:latest
    build:
      context: ./web
    env_file:
      - ./web/.env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - app-storage:/var/www/html/storage
      - app-database:/var/www/html/database
    restart: unless-stopped
    depends_on:
      - generator

  generator:
    image: d8m1kkz/blender-gen:latest
    build:
      context: ./gen
    shm_size: '256mb'
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  app-storage:
  app-database: