# Продакшен: исходники скопированы в образы, bind-mount'ов кода нет.
# Сборка: docker compose -f docker-compose.prod.yml build
# Запуск: docker compose -f docker-compose.prod.yml up -d
# Секреты (APP_KEY и т.д.) задайте в файле web/.env.production (в образ не копируется).
services:
  nginx:
    image: d8m1kkz/blender-nginx:latest
    build:
      context: ./web
      target: web
      additional_contexts:
        nginx: ./nginx
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - php
      - generator

  php:
    image: d8m1kkz/blender-php:latest
    build:
      context: ./web
      target: app
    env_file:
      - ./web/.env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - app-storage:/var/www/html/storage
      - app-database:/var/www/html/database
    restart: unless-stopped
    depends_on:
      - generator

  generator:
    image: d8m1kkz/blender-gen:latest
    build:
      context: ./gen
      target: prod
    shm_size: '256mb'
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  app-storage:
  app-database:
