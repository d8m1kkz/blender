# Лимит логов Docker (иначе json-file растёт бесконечно): до 3 файлов по 10 МБ на контейнер
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: d8m1kkz/blender-nginx:latest
    build:
      context: ./web
      target: web
    ports:
      - "80:80"
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - php
      - gen
      - mcp

  php:
    image: d8m1kkz/blender-php:latest
    build:
      context: ./web
      target: app
    env_file:
      - ./web/.env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - app-storage:/var/www/html/storage
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - gen

  gen:
    image: d8m1kkz/blender-gen:latest
    build:
      context: ./gen
    shm_size: '256mb'
    environment:
      - PYTHONUNBUFFERED=1
    logging: *default-logging
    restart: unless-stopped

  mcp:
    image: d8m1kkz/blender-mcp:latest
    build:
      context: ./mcp
    environment:
      - PYTHONUNBUFFERED=1
      - GEN_WS=ws://gen:8080/ws
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - gen

volumes:
  app-storage: