# В варианте с HTTPS (compose.caddy.yml) TLS терминирует caddy и передаёт сюда обычный HTTP с X-Forwarded-Proto: https.
# Сообщаем php-fpm, что исходное соединение — HTTPS: иначе Laravel строит ссылки на ассеты
# как http://… и браузер блокирует их на https-странице (mixed content).
# С caddy заголовку можно верить: порт nginx наружу не публикуется, а caddy перезаписывает X-Forwarded-*.
# Без caddy (compose.yml) заголовок мог бы прислать сам клиент — он повлияет только на ссылки в его же ответе.
map $http_x_forwarded_proto $fcgi_https {
	https   on;
	default "";
}

server {
	listen 80;
	server_name localhost;
	root /var/www/html/public_html;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-Content-Type-Options "nosniff";

	index index.php;
	charset utf-8;

	# 127.0.0.11 — встроенный DNS Docker. Вместе с переменной в fastcgi_pass nginx узнаёт адрес php
	# во время работы, а не только при запуске: после пересоздания контейнера php не будет ошибки 502.
	resolver 127.0.0.11 valid=10s;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}
	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }
	location ~ \.php$ {
		set $php_upstream php:9000;
		fastcgi_pass $php_upstream;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param HTTPS $fcgi_https if_not_empty;
	}
	error_page 404 /index.php;
}