# ЗАПАСНОЙ вариант: production с caddy и HTTPS (<IP>.sslip.io). Здесь только отличия от compose.yml.
# Запуск: docker compose -f compose.yml -f compose.caddy.yml up -d  (нужны SITE_HOST в .env и caddy/Caddyfile).
# Для https-страницы адреса в GEN_ORIGINS — только https.

services:
  # HTTPS: сам получает и продлевает сертификат Let's Encrypt для SITE_HOST (<IP>.sslip.io).
  # Порт 80 нужен для проверки домена и редиректа на HTTPS.
  caddy:
    image: caddy:2
    environment:
      - SITE_HOST=${SITE_HOST:-localhost} # адрес сайта для caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro # всё → nginx:80
      - caddy-data:/data # сертификаты: без тома выпускались бы заново при каждом пересоздании (лимиты Let's Encrypt)
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      - nginx

  # Снаружи вход один — caddy (80/443)
  nginx:
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
