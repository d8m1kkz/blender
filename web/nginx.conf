# В prod TLS терминирует caddy и передаёт сюда обычный HTTP с X-Forwarded-Proto: https.
# Сообщаем php-fpm, что исходное соединение — HTTPS: иначе Laravel строит ссылки на ассеты
# как http://… и браузер блокирует их на https-странице (mixed content).
# Заголовку можно верить: порт nginx наружу не публикуется, а caddy перезаписывает X-Forwarded-*.
map $http_x_forwarded_proto $fcgi_https {
	https   on;
	default "";
}

server {
	listen 80;
	server_name localhost;
	root /var/www/html/public;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-Content-Type-Options "nosniff";

	index index.php;
	charset utf-8;

	# WebSocket к Blender-генератору: общая корзина для всех клиентов
	location = /ws {
		proxy_pass http://gen:8080/ws;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		# uvicorn шлёт ping каждые 20 с, поэтому простаивающее соединение не закроется
		proxy_read_timeout 120s;
	}
	# MCP-сервер корзины (Streamable HTTP; ответы идут SSE-потоком — без буферизации)
	location = /mcp {
		proxy_pass http://mcp:8000/mcp;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_buffering off;
		proxy_read_timeout 120s; # set_basket ждёт модель до 60 с
	}
	# Текущая модель GLB для скачивания: ссылку выдаёт MCP-инструмент get_model_glb
	location = /model.glb {
		proxy_pass http://gen:8080/model;
		proxy_set_header Host $host;
	}
	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}
	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }
	location ~ \.php$ {
		fastcgi_pass php:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param HTTPS $fcgi_https if_not_empty;
	}
	error_page 404 /index.php;
}